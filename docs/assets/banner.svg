<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="LegacyRecomp">
  <!-- SPDX-License-Identifier: MIT -->
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0.16"/>
    </linearGradient>
    <pattern id="blocks" width="36" height="36" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="30" height="30" rx="3" fill="url(#fade)"/>
    </pattern>
    <linearGradient id="mask-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="grid-mask">
      <rect width="1280" height="300" fill="url(#mask-grad)"/>
    </mask>
    <clipPath id="card"><rect width="1280" height="300" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="300" fill="#0f1216"/>
    <rect width="1280" height="300" fill="#4ade80" opacity="0.10" mask="url(#grid-mask)"/>
    <rect x="0" y="6" width="1280" height="300" fill="url(#blocks)" mask="url(#grid-mask)"/>
  </g>
  <!-- isometric block -->
  <g transform="translate(110 70)">
    <polygon points="80,0 160,40 80,80 0,40" fill="#86efac"/>
    <polygon points="0,40 80,80 80,170 0,130" fill="#22c55e"/>
    <polygon points="160,40 80,80 80,170 160,130" fill="#15803d"/>
  </g>
  <text x="320" y="168" fill="#f3f4f6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-1">LegacyRecomp</text>
  <text x="324" y="218" fill="#4ade80" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="26">PowerPC → x86-64</text>
</svg>
